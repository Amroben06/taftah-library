<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جميع الكتب — مركز تفتح</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/shared.css">
</head>
<body>

<nav class="navbar" id="navbar">
  <a href="/index.html" class="nav-brand">
    <div class="nav-logo">📚</div>
    <div class="nav-brand-text">
      <span class="nav-brand-ar">مركز تفتح</span>
      <span class="nav-brand-fr">Bibliothèque Numérique</span>
    </div>
  </a>
  <ul class="nav-links">
    <li><a href="/books.html" style="color:var(--gold-light)">الكتب</a></li>
    <li><a href="/category.html">التصنيفات</a></li>
    <li><a href="/favorites.html">المفضلة</a></li>
    <li><a href="/about.html">من نحن</a></li>
  </ul>
  <div class="nav-actions" id="nav-actions"></div>
</nav>

<div style="padding: 100px 5% 60px;">

  <!-- Header -->
  <div style="margin-bottom:36px;">
    <div class="section-label">استعرض الكتالوج</div>
    <div class="section-title">جميع الكتب</div>
  </div>

  <!-- Filters -->
  <div class="filters-bar">
    <input type="text" id="searchInput" class="filter-input" placeholder="🔍 ابحث بالعنوان أو المؤلف..." oninput="loadBooks()">
    <select id="langFilter" class="filter-select" onchange="loadBooks()">
      <option value="">كل اللغات</option>
      <option value="AR">العربية</option>
      <option value="FR">Français</option>
      <option value="EN">English</option>
      <option value="AMZ">ⵜⴰⵎⴰⵣⵉⵖⵜ</option>
    </select>
    <select id="catFilter" class="filter-select" onchange="loadBooks()">
      <option value="">كل التصنيفات</option>
      <option value="التربية">التربية</option>
      <option value="العلوم">العلوم</option>
      <option value="التاريخ">التاريخ</option>
      <option value="الجغرافيا">الجغرافيا</option>
      <option value="الصحة">الصحة</option>
      <option value="الرياضيات">الرياضيات</option>
      <option value="الأمازيغية">الأمازيغية</option>
    </select>
    <select id="sortFilter" class="filter-select" onchange="loadBooks()">
      <option value="newest">الأحدث</option>
      <option value="downloads">الأكثر تحميلاً</option>
      <option value="rating">الأعلى تقييماً</option>
    </select>
  </div>

  <!-- Results count -->
  <div id="resultsCount" style="font-size:13px;color:var(--text-muted);margin-bottom:24px;"></div>

  <!-- Books Grid -->
  <div class="books-grid" id="booksGrid">
    <div class="loading-spinner"></div>
  </div>
</div>

<!-- Book Detail Modal -->
<div class="book-overlay" id="bookOverlay" onclick="closeBook(event)">
  <div class="book-detail" onclick="event.stopPropagation()" style="position:relative;">
    <button class="book-detail-close" onclick="closeBook()">✕</button>
    <div class="book-detail-top">
      <div class="book-detail-cover" id="bookDetailCover">
        <span id="bookDetailEmoji">📚</span>
      </div>
      <div class="book-detail-info">
        <div class="book-detail-lang" id="bookDetailLang"></div>
        <div class="book-detail-title" id="bookDetailTitle"></div>
        <div class="book-detail-author" id="bookDetailAuthor"></div>
        <div class="book-detail-rating-row">
          <span class="book-detail-stars" id="bookDetailStars"></span>
          <span class="book-detail-rating-num" id="bookDetailRating"></span>
        </div>
        <div class="book-detail-desc" id="bookDetailDesc"></div>
        <div class="book-detail-meta">
          <div class="book-detail-meta-item">
            <div class="book-detail-meta-label">التصنيف</div>
            <div class="book-detail-meta-val" id="bookDetailCat"></div>
          </div>
          <div class="book-detail-meta-item">
            <div class="book-detail-meta-label">الصفحات</div>
            <div class="book-detail-meta-val" id="bookDetailPages"></div>
          </div>
          <div class="book-detail-meta-item">
            <div class="book-detail-meta-label">السنة</div>
            <div class="book-detail-meta-val" id="bookDetailYear"></div>
          </div>
          <div class="book-detail-meta-item">
            <div class="book-detail-meta-label">التحميلات</div>
            <div class="book-detail-meta-val" id="bookDetailDownloads"></div>
          </div>
        </div>
        <div class="book-detail-actions">
          <button class="btn-read" id="btnRead">📖 قراءة الآن</button>
          <button class="btn-dl"   id="btnDownload">⬇ تحميل</button>
          <button class="btn-dl"   id="btnFavorite">🔖 حفظ</button>
        </div>
      </div>
    </div>
    <div class="book-detail-bottom">
      <div class="book-detail-reviews-title">تقييمات القراء</div>
      <div id="bookReviews" class="book-mini-reviews"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="/js/api.js"></script>
<script>
renderNavbar();
let currentBookId = null;

async function loadBooks() {
  const grid = document.getElementById('booksGrid');
  grid.innerHTML = '<div class="loading-spinner"></div>';
  try {
    const books = await Books.getAll({
      search: document.getElementById('searchInput').value,
      lang:   document.getElementById('langFilter').value,
      category: document.getElementById('catFilter').value,
      sort:   document.getElementById('sortFilter').value,
    });
    document.getElementById('resultsCount').textContent = `${books.length} كتاب`;
    grid.innerHTML = books.length ? '' : '<p style="color:var(--text-muted);grid-column:1/-1;text-align:center;padding:60px 0">لا توجد كتب مطابقة 📭</p>';
    books.forEach((book, i) => {
      const card = document.createElement('div');
      card.className = 'book-card';
      card.style.animationDelay = (i % 8 * 0.06) + 's';
      card.innerHTML = `
        <div class="book-cover" style="background:${book.cover_color}">
          <div class="book-cover-spine"></div>
          <div class="book-emoji">${book.cover_emoji}</div>
          <div class="book-cover-title">${book.title}</div>
        </div>
        <div class="book-body">
          <div class="book-title">${book.title}</div>
          <div class="book-author">${book.author}</div>
          <div class="book-rating">
            <span class="book-stars">${'★'.repeat(Math.round(book.rating || 0))}${'☆'.repeat(5-Math.round(book.rating||0))}</span>
            <span class="book-rating-num">(${(book.rating||0).toFixed(1)})</span>
          </div>
          <div class="book-footer">
            <span class="book-lang-badge">${book.language}</span>
            <div class="book-icon-actions">
              <button class="icon-btn-dark" onclick="event.stopPropagation();handleDownload(${book.id})" title="تحميل">⬇</button>
              <button class="icon-btn-dark" onclick="event.stopPropagation();handleFavorite(${book.id})" title="مفضلة">🔖</button>
            </div>
          </div>
        </div>`;
      card.onclick = () => openBook(book);
      setTimeout(() => card.classList.add('fade-in'), i * 60);
      grid.appendChild(card);
    });
  } catch(e) {
    grid.innerHTML = `<p style="color:var(--text-muted);grid-column:1/-1;text-align:center;padding:60px 0">⚠️ ${e.message}</p>`;
  }
}

async function openBook(book) {
  currentBookId = book.id;
  document.getElementById('bookDetailCover').style.background = book.cover_color;
  document.getElementById('bookDetailEmoji').textContent = book.cover_emoji;
  document.getElementById('bookDetailTitle').textContent = book.title;
  document.getElementById('bookDetailAuthor').textContent = book.author;
  document.getElementById('bookDetailLang').textContent = book.language;
  document.getElementById('bookDetailRating').textContent = (book.rating||0).toFixed(1) + ' / 5';
  document.getElementById('bookDetailDesc').textContent = book.description || '—';
  document.getElementById('bookDetailCat').textContent = book.category;
  document.getElementById('bookDetailPages').textContent = book.pages || '—';
  document.getElementById('bookDetailYear').textContent = book.year || '—';
  document.getElementById('bookDetailDownloads').textContent = book.downloads || 0;
  const r = book.rating || 0;
  document.getElementById('bookDetailStars').textContent = '★'.repeat(Math.round(r)) + '☆'.repeat(5-Math.round(r));
  document.getElementById('btnDownload').onclick = () => handleDownload(book.id);
  document.getElementById('btnFavorite').onclick = () => handleFavorite(book.id);
  document.getElementById('bookOverlay').classList.add('open');
  // Load reviews
  try {
    const reviews = await Books.getReviews(book.id);
    const el = document.getElementById('bookReviews');
    el.innerHTML = reviews.length ? reviews.map(rv => `
      <div class="book-mini-review">
        <div class="mini-avatar">${rv.name[0]}</div>
        <div><div class="mini-review-name">${rv.name}</div>
        <div class="mini-review-stars">${'★'.repeat(rv.rating)}${'☆'.repeat(5-rv.rating)}</div>
        <div class="mini-review-text">${rv.comment || ''}</div></div>
      </div>`).join('') : '<p style="color:var(--text-muted);font-size:13px;">لا توجد تقييمات بعد</p>';
  } catch {}
}

function closeBook(e) {
  if (!e || e.target === document.getElementById('bookOverlay'))
    document.getElementById('bookOverlay').classList.remove('open');
}

async function handleDownload(id) {
  try { await Books.download(id); showToast('⬇️ جاري التحميل...'); }
  catch(e) { showToast('❌ ' + e.message); }
}

async function handleFavorite(id) {
  if (!isLoggedIn()) { showToast('⚠️ يرجى تسجيل الدخول أولاً'); return; }
  try { await Users.addFavorite(id); showToast('🔖 تمت الإضافة للمفضلة!'); }
  catch(e) { showToast('❌ ' + e.message); }
}

loadBooks();
</script>
</body>
</html>
