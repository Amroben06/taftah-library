<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ملفي — مركز تفتح</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/shared.css">
</head>
<body>
<nav class="navbar" id="navbar">
  <a href="/index.html" class="nav-brand">
    <div class="nav-logo">📚</div>
    <div class="nav-brand-text">
      <span class="nav-brand-ar">مركز تفتح</span>
      <span class="nav-brand-fr">Bibliothèque Numérique</span>
    </div>
  </a>
  <ul class="nav-links">
    <li><a href="/books.html">الكتب</a></li>
    <li><a href="/category.html">التصنيفات</a></li>
    <li><a href="/favorites.html">المفضلة</a></li>
    <li><a href="/about.html">من نحن</a></li>
  </ul>
  <div class="nav-actions" id="nav-actions"></div>
</nav>

<div style="padding:100px 5% 60px;max-width:700px;margin:0 auto;">
  <div id="profileContent"><div class="loading-spinner"></div></div>
</div>

<div class="toast" id="toast"></div>
<script src="/js/api.js"></script>
<script>
renderNavbar();

async function loadProfile() {
  const content = document.getElementById('profileContent');
  if (!isLoggedIn()) {
    content.innerHTML = `<div style="text-align:center;padding:80px 20px;">
      <div style="font-size:64px;margin-bottom:16px;">🔒</div>
      <div class="section-title" style="font-size:24px;">يرجى تسجيل الدخول</div>
    </div>`;
    return;
  }
  try {
    const user = await Users.me();
    const favs = await Users.getFavorites();
    content.innerHTML = `
      <!-- Profile Card -->
      <div style="background:var(--bg-card);border:1px solid var(--border-strong);border-radius:20px;padding:32px;margin-bottom:24px;position:relative;overflow:hidden;">
        <div style="position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 50% 0%,rgba(201,151,58,0.08),transparent);pointer-events:none;"></div>
        <div style="display:flex;align-items:center;gap:20px;margin-bottom:28px;">
          <div style="width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--teal));display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:#1a0e00;flex-shrink:0;">
            ${user.name[0]}
          </div>
          <div>
            <div style="font-family:'Amiri',serif;font-size:24px;color:var(--text-primary);">${user.name}</div>
            <div style="font-size:13px;color:var(--text-muted);">${user.email}</div>
            <div style="margin-top:6px;">
              <span style="font-size:11px;font-weight:700;padding:3px 10px;border-radius:50px;background:rgba(201,151,58,0.12);color:var(--gold);border:1px solid var(--border);">
                ${user.role === 'admin' ? '👑 مسؤول' : '👤 قارئ'}
              </span>
            </div>
          </div>
        </div>

        <!-- Stats -->
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:2px;border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:28px;">
          <div style="background:rgba(255,255,255,0.02);padding:20px;text-align:center;">
            <div style="font-size:28px;font-weight:700;color:var(--gold-light);">${favs.length}</div>
            <div style="font-size:12px;color:var(--text-muted);">كتاب محفوظ</div>
          </div>
          <div style="background:rgba(255,255,255,0.02);padding:20px;text-align:center;border-right:1px solid var(--border);border-left:1px solid var(--border);">
            <div style="font-size:28px;font-weight:700;color:var(--gold-light);">0</div>
            <div style="font-size:12px;color:var(--text-muted);">كتاب مكتمل</div>
          </div>
          <div style="background:rgba(255,255,255,0.02);padding:20px;text-align:center;">
            <div style="font-size:28px;font-weight:700;color:var(--gold-light);">0</div>
            <div style="font-size:12px;color:var(--text-muted);">تقييم</div>
          </div>
        </div>

        <!-- Edit form -->
        <div>
          <div style="font-size:14px;font-weight:600;color:var(--text-secondary);margin-bottom:8px;">تعديل الاسم</div>
          <div style="display:flex;gap:10px;">
            <input id="nameInput" type="text" class="auth-input" value="${user.name}" style="flex:1;">
            <button class="btn-primary" style="padding:0 20px;border-radius:8px;height:46px;font-size:14px;" onclick="updateName()">حفظ</button>
          </div>
        </div>
      </div>

      <!-- Member since -->
      <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:20px 24px;display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;">
        <div>
          <div style="font-size:12px;color:var(--text-muted);margin-bottom:4px;">عضو منذ</div>
          <div style="font-size:15px;color:var(--text-primary);font-weight:600;">${new Date(user.created_at).toLocaleDateString('ar-MA',{year:'numeric',month:'long',day:'numeric'})}</div>
        </div>
        <div style="font-size:32px;">🗓️</div>
      </div>

      <!-- Danger zone -->
      <div style="background:var(--bg-card);border:1px solid rgba(239,68,68,0.2);border-radius:14px;padding:20px 24px;">
        <div style="font-size:14px;font-weight:600;color:#f87171;margin-bottom:12px;">منطقة الخطر</div>
        <button onclick="if(confirm('هل أنت متأكد؟'))logout()" style="background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);color:#f87171;padding:10px 20px;border-radius:8px;cursor:pointer;font-family:'Cairo',sans-serif;font-size:14px;">
          تسجيل الخروج 🚪
        </button>
      </div>`;
  } catch(e) {
    content.innerHTML = '<p style="color:var(--text-muted)">⚠️ ' + e.message + '</p>';
  }
}

async function updateName() {
  const name = document.getElementById('nameInput').value.trim();
  if (!name) return showToast('⚠️ الاسم لا يمكن أن يكون فارغاً');
  try {
    await Users.update(name);
    const user = getUser();
    user.name = name;
    localStorage.setItem('user', JSON.stringify(user));
    showToast('✅ تم تحديث الاسم');
    renderNavbar();
  } catch(e) { showToast('❌ ' + e.message); }
}

loadProfile();
</script>
</body>
</html>
